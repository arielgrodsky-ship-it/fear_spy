name: Market correction alert

on:
  schedule:
    # Every 15 minutes on weekdays, with a UTC buffer covering US market hours year-round.
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write   # needed to commit data.json back to the repo

concurrency:
  group: market-correction-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN — no extra secret needed
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run market check (fetches data + writes data.json + sends alerts)
        env:
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID:      ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:       ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:             ${{ secrets.TWILIO_FROM }}
          SMS_TO:                  ${{ secrets.SMS_TO }}
          WHATSAPP_ACCESS_TOKEN:   ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO:             ${{ secrets.WHATSAPP_TO }}
        run: node backend/check-market.mjs

      - name: Commit updated data.json and state.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data.json backend/state.json
          # Only commit if something changed
          git diff --cached --quiet || git commit -m "chore: update market data [skip ci]"
          git push
